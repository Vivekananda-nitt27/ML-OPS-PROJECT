<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>US Visa Prediction</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
      <span class="navbar-brand mx-auto fw-bold text-primary">
        🇺🇸 US Visa Prediction System
      </span>
    </div>
  </nav>

  <!-- Main Section -->
  <section class="py-5">
    <div class="container">

      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-5">

          <h3 class="text-center mb-4 fw-bold">Visa Approval Prediction Form</h3>

          <form action="/" method="post">

            <!-- Row 1 -->
            <div class="row g-4">
              <div class="col-md-6">
                <label class="form-label">Continent</label>
                <select class="form-select" name="continent" required>
                  <option disabled selected>Select Continent</option>
                  <option>Asia</option>
                  <option>Africa</option>
                  <option>North America</option>
                  <option>Europe</option>
                  <option>South America</option>
                  <option>Oceania</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label">Education</label>
                <select class="form-select" name="education_of_employee" required>
                  <option disabled selected>Select Education</option>
                  <option>High School</option>
                  <option>Bachelor's</option>
                  <option>Master's</option>
                  <option>Doctorate</option>
                </select>
              </div>
            </div>

            <!-- Row 2 -->
            <div class="row g-4 mt-1">
              <div class="col-md-6">
                <label class="form-label">Job Experience</label>
                <select class="form-select" name="has_job_experience" required>
                  <option disabled selected>Select</option>
                  <option>Y</option>
                  <option>N</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label">Job Training Required</label>
                <select class="form-select" name="requires_job_training" required>
                  <option disabled selected>Select</option>
                  <option>Y</option>
                  <option>N</option>
                </select>
              </div>
            </div>

            <!-- Row 3 -->
            <div class="row g-4 mt-1">
              <div class="col-md-6">
                <label class="form-label">Number of Employees</label>
                <input type="number" class="form-control" name="no_of_employees" min="15000" max="40000" required>
              </div>

              <div class="col-md-6">
                <label class="form-label">Region</label>
                <select class="form-select" name="region_of_employment" required>
                  <option disabled selected>Select Region</option>
                  <option>West</option>
                  <option>Northeast</option>
                  <option>South</option>
                  <option>Midwest</option>
                  <option>Island</option>
                </select>
              </div>
            </div>

            <!-- Row 4 -->
            <div class="row g-4 mt-1">
              <div class="col-md-6">
                <label class="form-label">Prevailing Wage</label>
                <input type="number" class="form-control" name="prevailing_wage" min="700" max="70000" required>
              </div>

              <div class="col-md-6">
                <label class="form-label">Contract Tenure</label>
                <select class="form-select" name="unit_of_wage" required>
                  <option disabled selected>Select</option>
                  <option>Hour</option>
                  <option>Week</option>
                  <option>Month</option>
                  <option>Year</option>
                </select>
              </div>
            </div>

            <!-- Row 5 -->
            <div class="row g-4 mt-1">
              <div class="col-md-6">
                <label class="form-label">Full Time Position</label>
                <select class="form-select" name="full_time_position" required>
                  <option disabled selected>Select</option>
                  <option>Y</option>
                  <option>N</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label">Company Age (Years)</label>
                <input type="number" class="form-control" name="company_age" min="10" max="180" required>
              </div>
            </div>

            <!-- Submit -->
            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-primary btn-lg rounded-pill">
                🔮 Predict Visa Status
              </button>
            </div>

          </form>
        </div>
      </div>

      <!-- Result -->
      {% if context %}
      <div class="alert alert-info text-center mt-4 fw-bold fs-4">
        Visa Prediction Status: {{ context }}
      </div>
      {% endif %}

    </div>
  </section>

</body>
</html>
