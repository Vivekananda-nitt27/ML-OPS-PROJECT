name: Deploy Docker App to EC2

on:
  push:
    branches: [ main ]

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2   # ✅ correct region

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ECR_REPO: ${{ secrets.ECR_REPO }}
        run: |
          IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.ap-southeast-2.amazonaws.com/$ECR_REPO:latest
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

  cd:
    name: Continuous Deployment
    needs: ci
    runs-on: self-hosted

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2   # ✅ required for ECR auth

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2   # ✅ FIXES your error

      - name: Deploy application on EC2
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ECR_REPO: ${{ secrets.ECR_REPO }}
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
        run: |
          IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.ap-southeast-2.amazonaws.com/$ECR_REPO:latest

          docker pull $IMAGE_URI

          docker stop visa-app || true
          docker rm visa-app || true

          docker run -d \
            --name visa-app \
            -p 8080:8080 \
            -e MONGODB_URL="$MONGODB_URL" \
            $IMAGE_URI
